name: image

# Build the hub image, for x86 and ARM, and push it to GitHub Container Registry, on pushes to main, to feature
# branches (tagged with the branch and the commit) and on version tags.
# GitHub-hosted runners only. Never point this repository at a self-hosted runner.
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/norjms/artisan-hub

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libxml2 libxslt1.1
          pip install --no-cache-dir -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Artisan Hub
            org.opencontainers.image.description=Self-hosted product, inventory and print farm hub for 3D printing
            org.opencontainers.image.source=https://github.com/norjms/artisan-hub
            org.opencontainers.image.url=https://github.com/norjms/artisan-hub
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.authors=James Norman
      - id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the digest
        run: |
          echo "Image: ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
