# Artisan Hub with Docker Compose: a starting point for self-hosting.
# Copy to compose.yml, set the two values marked CHANGE ME, then: docker compose up -d --build
# To use the published image instead of building, replace "build: ." with the image line below.
# All settings: docs/configuration.md

x-hub-env: &hub-env
  HUB_PUBLIC_URL: http://localhost:8080
  HUB_DATABASE_URL: postgresql+psycopg://hub:CHANGE_ME_DB_PASSWORD@db:5432/hub
  HUB_SESSION_SECRET: CHANGE_ME_LONG_RANDOM_VALUE
  # Sign-in through an OpenID Connect provider, for example Authentik:
  # HUB_OIDC_ISSUER: https://auth.example.com/application/o/artisan-hub/
  # HUB_OIDC_CLIENT_ID: artisan-hub
  # HUB_OIDC_CLIENT_SECRET: ...

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    # image: ghcr.io/norjms/artisan-hub:main
    image: artisan-hub:local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: *hub-env
    ports: ["8080:8080"]
    volumes:
      - hubdata:/data
      - library:/srv/library

  worker:
    image: artisan-hub:local
    # image: ghcr.io/norjms/artisan-hub:main
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_started }
    environment: *hub-env
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    volumes:
      - hubdata:/data
      - library:/srv/library

volumes:
  pgdata:
  hubdata:
  library:
