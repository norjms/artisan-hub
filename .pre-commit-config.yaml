# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: provenance
        name: provenance (no development-tool files)
        entry: python tools/check_provenance.py --no-commits
        language: system
        pass_filenames: false
        always_run: true
