<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Paint in the person's theme before anything renders (saved choice, else the system's light/dark).
      (function () {
        var skin = 'watchtower', mode = 'system';
        try { skin = localStorage.getItem('hub.skin') || skin; mode = localStorage.getItem('hub.mode') || mode; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Artisan Hub</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
