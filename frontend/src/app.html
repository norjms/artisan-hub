<!doctype html>
<html lang="en" class="ah-root" data-theme="glass-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Paint in the person's look before anything renders: glass-dark is the only theme; reduce transparency
      // follows the device unless they chose on or off (lib/theme.svelte.js keeps these in step).
      (function () {
        var r = 'auto';
        try { r = localStorage.getItem('hub.reduce') || r; } catch (e) {}
        var el = document.documentElement;
        el.dataset.theme = 'glass-dark';
        if (r === 'on') el.dataset.transparency = 'off';
        else if (r === 'off') el.dataset.transparency = 'on';
      })();
    </script>
    <title>ArtisanHub</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
